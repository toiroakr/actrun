name: Release (fork)

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'toiroakr/actrun'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install MoonBit CLI
        uses: ./.github/actions/setup-moonbit
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          moon update
      - name: Create a release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bash scripts/release_publish.sh
          pr-title: "chore: release"
          commit-message: "chore: release"
          # The action pushes the tag before creating the release and never
          # retries a failed release, so release_publish.sh creates both.
          create-github-releases: false
          push-git-tags: false
