name: Setup MoonBit
description: Install a MoonBit toolchain for CI
inputs:
  version:
    description: >-
      MoonBit release version to install (empty installs the latest).
      Pinned to the toolchain upstream last passed `moon check --deny-warn` with:
      moonc 0.10.14 / moon 0.1.20260920 turn implicit_impl_as_method and
      test_unqualified_package into errors across unchanged upstream code.
    required: false
    default: "0.10.13+cbb11c36f"
runs:
  using: composite
  steps:
    - name: Install MoonBit CLI
      shell: bash
      env:
        MOON_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$MOON_VERSION" ]; then
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOON_VERSION"
        else
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        fi
    # karinto: ignore[github-env] the installed CLI must be on PATH; this directory is fixed under the runner HOME
    - name: Add MoonBit CLI to PATH
      shell: bash
      run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
